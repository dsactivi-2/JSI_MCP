interface:
  display_name: "CRM-Kandidatensuche"
  short_description: "Kandidaten gezielt suchen und sicher filtern"
  default_prompt: "Mujo udri — nutze $crm-kandidatensuche, um Kandidaten mit den genannten CRM-Filtern read-only zu suchen."
dependencies:
  tools:
    - type: "mcp"
      value: "cloud-crm-mcp"
      description: "This read-only Cloud CRM MCP server. Codex reaches it through the connection named crm-remote. Do not call the old Worker."
      transport: "streamable_http"
      url: "https://calm-forge-hk9rc.run.mcp-use.com/mcp"
policy:
  allow_implicit_invocation: true
